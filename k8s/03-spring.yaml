apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/actuator/prometheus"
        prometheus.io/port: "444"
    spec:
      containers:
      - name: spring-app
        image: europe-central2-docker.pkg.dev/uplifted-sol-493208-m7/projekt-biblioteka/spring-app:abc313d9a93814ac016d8f0e2051e230b1c91e75
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 444
        env:
        - name: SERVER_PORT           
          value: "444"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-service:5432/BibliotekaSpring"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "student"
        
        - name: SPRING_WEB_CORS_ALLOWED_ORIGINS
          value: "*"
        - name: SPRING_WEB_CORS_ALLOW_CREDENTIALS
          value: "true"
        
---
apiVersion: v1
kind: Service
metadata:
  name: spring-service
  annotations:
    cloud.google.com/backend-config: '{"default": "spring-backend-config"}'
spec:
  type: NodePort
  selector:
    app: spring-app
  ports:
    - port: 444
      targetPort: 444
      nodePort: 30444 
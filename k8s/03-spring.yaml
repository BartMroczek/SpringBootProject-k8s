apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
      - name: spring-app
        image: europe-central2-docker.pkg.dev/uplifted-sol-493208-m7/projekt-biblioteka/spring-app:v21
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 444
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-service:5432/BibliotekaSpring"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "student"
        
        - name: SPRING_WEB_CORS_ALLOWED_ORIGINS
          value: "*"
        - name: SPRING_WEB_CORS_ALLOW_CREDENTIALS
          value: "true"
        
---
apiVersion: v1
kind: Service
metadata:
  name: spring-service
spec:
  type: LoadBalancer
  selector:
    app: spring-app
  ports:
    - port: 444
      targetPort: 444
      nodePort: 30444 
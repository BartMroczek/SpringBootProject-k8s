name: CI/CD Pipeline Biblioteka

on:
  push:
    branches: [ "main" ]

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  CLUSTER_NAME: klaster-biblioteka 
  BACKEND_IMAGE: europe-central2-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/projekt-biblioteka/spring-app
  FRONTEND_IMAGE: europe-central2-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/projekt-biblioteka/react-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Google Auth
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up GCloud
      uses: google-github-actions/setup-gcloud@v1

    - name: Configure Docker
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

    - name: Build and Push Backend
      run: |
        cd BACKEND
        docker build -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} .
        docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

    - name: Build and Push Frontend
      run: |
        cd KLIENT
        docker build -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} .
        docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

    - name: Get GKE Credentials
      uses: google-github-actions/get-gke-credentials@v1
      with:
        cluster_name: ${{ env.CLUSTER_NAME }}
        location: ${{ env.REGION }}

    - name: Update YAMLs and Deploy
      run: |
        sed -i "s|image: .*spring-app.*|image: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}|g" k8s/03-spring.yaml
        sed -i "s|image: .*react-app.*|image: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}|g" k8s/04-react.yaml
        
        kubectl apply -f k8s/

    - name: Verify Deployment
      run: |
        kubectl rollout status deployment/spring-app-deployment
        kubectl rollout status deployment/react-app-deployment
